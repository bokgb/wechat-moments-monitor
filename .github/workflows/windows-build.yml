name: Windows build

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Test monitor state machine
        run: python -m unittest discover -s tests -v
      - name: Audit public source
        run: python tools/audit_source.py
      - name: Check hidden UI
        run: python tools/check_ui_hidden.py
      - name: Build Windows application
        run: python tools/build.py
      - uses: actions/upload-artifact@v4
        with:
          name: MomentsMonitor-windows-x64
          path: dist/MomentsMonitor
          if-no-files-found: error
